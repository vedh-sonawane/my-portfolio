<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Ground pour, physical half: warm copper hatch flooding the unrouted
       area, with the perfboard drill grid punched through it. Tiled by CSS,
       so the browser rasterises 32x32 once instead of the whole board. -->
  <g stroke="rgb(195,154,107)" stroke-opacity="0.13" stroke-width="1" fill="none">
    <path d="M0 16 L16 0" />
    <path d="M0 32 L32 0" />
    <path d="M16 32 L32 16" />
  </g>
  <circle cx="16" cy="16" r="3.4" fill="none" stroke="rgb(195,154,107)" stroke-opacity="0.26" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="1.6" fill="rgb(4,6,6)" fill-opacity="0.85"/>
</svg>
